<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家計簿</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { spacing: { 'safe': 'env(safe-area-inset-bottom)' } } } }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    input, select, textarea { font-size: 16px !important; }
    ::-webkit-scrollbar { display: none; }
    .todo-item { transition: all 0.3s ease-out; }
    .custom-scrollbar::-webkit-scrollbar { display: block; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-900 h-[100dvh] w-full font-sans text-gray-800 flex justify-center overflow-hidden">
  
  <div id="login-screen" class="absolute inset-0 z-50 bg-gray-50 flex flex-col items-center justify-center hidden">
    <div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-sm w-full mx-4">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="wallet" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-800 mb-2">家計簿アプリ</h1>
      <p class="text-sm text-gray-500 mb-8">あなた専用の安全なデータベース</p>
      <button id="login-btn" class="w-full bg-white border-2 border-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl flex items-center justify-center hover:bg-gray-50 transition-colors">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-3" alt="Google">
        Googleアカウントでログイン
      </button>
    </div>
  </div>

  <div id="app-container" class="w-full max-w-md bg-gray-100 h-full flex flex-col relative shadow-2xl overflow-hidden hidden">
    <header id="header" class="bg-white px-4 py-3 shadow-sm z-10 flex justify-between items-center border-b border-gray-200 shrink-0"></header>
    <main id="main" class="flex-1 overflow-hidden relative bg-gray-50">
      <div id="tab-home" class="h-full overflow-y-auto overflow-x-hidden pb-20 px-4 pt-4 space-y-4 hidden"></div>
      <div id="tab-history" class="h-full overflow-y-auto overflow-x-hidden pb-20 px-4 pt-4 hidden"></div>
      <div id="tab-todo" class="h-full overflow-y-auto overflow-x-hidden pb-20 px-4 pt-4 hidden"></div>
      <div id="tab-yearly" class="h-full overflow-y-auto overflow-x-hidden pb-20 px-4 pt-4 space-y-4 hidden"></div>
      <div id="tab-settings" class="h-full overflow-y-auto overflow-x-hidden pb-20 px-4 pt-4 space-y-4 relative hidden"></div>
    </main>
    <nav id="nav" class="bg-white border-t border-gray-200 w-full px-2 py-2 flex justify-between items-center z-20 pb-safe shrink-0"></nav>
    <div id="modals" class="relative z-50"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAW0RzaHk4UJmOzT5Yej23YWcJsVcMVPVA",
      authDomain: "kakeibo-8ffc5.firebaseapp.com",
      projectId: "kakeibo-8ffc5",
      storageBucket: "kakeibo-8ffc5.firebasestorage.app",
      messagingSenderId: "480038367159",
      appId: "1:480038367159:web:a11b9feaf863d5e0f8c232",
      measurementId: "G-CDQSRV1M3N"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;

    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwuG0Zj3zl4n7o-Y-YGDz8ASqLKD7R8mT8ZvNcWzwkna6JK68gmwZTAo6D2UNZYI9vM/exec"; 

    const escapeHTML = (str) => {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };
    const getCycle = (dateStr) => {
      const d = new Date(dateStr);
      let year = d.getFullYear(), month = d.getMonth() + 1, day = d.getDate();
      if (day >= 16) { month += 1; if (month > 12) { month = 1; year += 1; } }
      let startYear = year, startMonth = month - 2; 
      if (startMonth < 0) { startMonth += 12; startYear -= 1; }
      let endYear = year, endMonth = month - 1;
      if (endMonth < 0) { endMonth += 12; endYear -= 1; }
      return { year, month, startDate: new Date(startYear, startMonth, 16), endDate: new Date(endYear, endMonth, 15) };
    };
    const getCycleFromYearMonth = (year, month) => {
      let startYear = year, startMonth = month - 2; 
      if (startMonth < 0) { startMonth += 12; startYear -= 1; }
      return new Date(startYear, startMonth, 16);
    };
    const formatDate = (date) => {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    };
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(amount);
    };
    const generateUUID = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2) + Date.now().toString(36);

    const initialData = {
      budget: { monthly: 200000, yearly: 2400000, yearlyIncome: 3500000 },
      categories: [
        { id: 1, name: '食費', type: 'variable' }, { id: 2, name: '日用品', type: 'variable' },
        { id: 3, name: '交通費', type: 'variable' }, { id: 4, name: '交際費', type: 'variable' },
        { id: 5, name: '趣味', type: 'variable' }, { id: 9, name: 'その他', type: 'variable' },
        { id: 101, name: '出張手当', type: 'income' }, { id: 102, name: 'その他収入', type: 'income' }
      ],
      fixedCosts: [
        { id: 1, name: '家賃', amount: 80000, withdrawalDay: 25 },
        { id: 2, name: 'スマホ・ネット代', amount: 10000, withdrawalDay: 10 },
      ],
      specialTransactions: [],
      expenses: []
    };

    let appData = null;
    let activeTab = 'home';
    let viewCycleDate = new Date();
    
    let currentTransactionType = 'expense';
    let selectedVariableCategoryId = 1;
    let showFixedForm = false;
    let includeFixedCostsInChart = true;
    
    let deleteCatModalState = { isOpen: false, catId: null };
    let confirmModalState = { isOpen: false, message: '', onConfirm: null };
    let alertModalState = { isOpen: false, message: '' };
    let editExpenseModalState = { isOpen: false, expId: null };
    let editSpecialModalState = { isOpen: false, stId: null };
    
    let isSyncing = false;

    const saveData = async () => {
      if (!currentUser) return;
      isSyncing = true;
      updateSyncStatusUI();
      try {
        await setDoc(doc(db, "users", currentUser.uid), appData);
      } catch (e) {
        alert("データの保存に失敗しました");
      }
      isSyncing = false;
      updateSyncStatusUI();
    };

    const updateSyncStatusUI = () => {
      const headerIcon = document.getElementById('header-sync-status');
      const settingsText = document.getElementById('sync-status-text');
      
      let iconHtml = isSyncing ? '<i data-lucide="refresh-cw" class="w-5 h-5 text-blue-500 animate-spin"></i>' : '<i data-lucide="cloud-check" class="w-5 h-5 text-emerald-500"></i>';
      let text = isSyncing ? '同期中...' : 'クラウド同期済';
      let colorClass = isSyncing ? 'text-blue-500' : 'text-emerald-500';

      if (headerIcon) headerIcon.innerHTML = iconHtml;
      if (settingsText) {
         settingsText.innerHTML = text;
         settingsText.className = `text-sm font-bold ${colorClass}`;
      }
      if (window.lucide) lucide.createIcons();
    };

    const confirmAction = (message, callback) => { confirmModalState = { isOpen: true, message, onConfirm: callback }; updateView(); };
    const alertAction = (message) => { alertModalState = { isOpen: true, message }; updateView(); };

    const sanitizeAppData = () => {
      if (!appData) appData = JSON.parse(JSON.stringify(initialData));
      if (appData.settings) delete appData.settings;
      if (!appData.budget) appData.budget = initialData.budget;
      if (!appData.categories) appData.categories = initialData.categories;
      if (!appData.fixedCosts) appData.fixedCosts = initialData.fixedCosts;
      if (!appData.specialTransactions) appData.specialTransactions = [];
      if (!appData.expenses) appData.expenses = [];
      if (!appData.categories.some(c => c.type === 'income')) {
        appData.categories.push({ id: 101, name: '出張手当', type: 'income' }, { id: 102, name: 'その他収入', type: 'income' });
      }

      if (!appData.chartGroups) {
        appData.chartGroups = {
          'g1': { name: '食費', color: 'bg-orange-400' },
          'g2': { name: '生活・趣味', color: 'bg-blue-500' },
          'g3': { name: 'その他', color: 'bg-gray-400' },
          'g4': { name: '未割り当て', color: 'bg-emerald-500' },
          'g5': { name: 'グループ5', color: 'bg-purple-500' },
          'g6': { name: 'グループ6', color: 'bg-pink-500' }
        };
      } else {
        if (!appData.chartGroups['g5']) appData.chartGroups['g5'] = { name: 'グループ5', color: 'bg-purple-500' };
        if (!appData.chartGroups['g6']) appData.chartGroups['g6'] = { name: 'グループ6', color: 'bg-pink-500' };
      }
      if (!appData.chartGroupOrder) appData.chartGroupOrder = ['g1', 'g2', 'g3', 'g4', 'g5', 'g6'];
      
      if (!appData.settingsOrder || appData.settingsOrder.length !== 6) {
        appData.settingsOrder = ['account', 'budget', 'chartGroup', 'category', 'fixed', 'special'];
      }

      appData.categories.forEach(c => {
        if (c.type === 'variable' && !c.groupId) {
          if (['スーパー', '外食', 'コンビニ'].some(kw => c.name.includes(kw))) c.groupId = 'g1';
          else if (['車', 'PL', '交通費', '交際費', '日用品', 'バドミントン'].some(kw => c.name.includes(kw))) c.groupId = 'g2';
          else c.groupId = 'g3';
        }
      });
    };

    const getCategoryName = (id) => {
      if (String(id) === 'unassigned') return '未選択';
      const cat = appData.categories.find(c => String(c.id) === String(id));
      return cat ? escapeHTML(cat.name) : '未選択';
    };

    const TODO_STORAGE_KEY = 'v3_budget_todo_data_html';
    let todoList = [];
    const loadTodo = () => { try { const saved = localStorage.getItem(TODO_STORAGE_KEY); todoList = saved ? JSON.parse(saved) : []; } catch (e) { todoList = []; } };
    const saveTodo = () => { try { localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(todoList)); } catch (e) {} };

    const checkAutoFixedCosts = () => {
      if (!appData || !appData.fixedCosts) return;
      const realCurrentCycle = getCycle(new Date());
      const cycleKey = `${realCurrentCycle.year}-${realCurrentCycle.month}`;
      let newExpenses = [];
      
      appData.fixedCosts.forEach(fc => {
        const isAlreadyAdded = appData.expenses.some(e => e.isAutoAdded && e.cycleKey === cycleKey && (String(e.fixedCostId) === String(fc.id) || (fc.categoryId && String(e.categoryId) === String(fc.categoryId))));
        if (!isAlreadyAdded) {
          newExpenses.push({
            id: generateUUID(), date: formatDate(realCurrentCycle.startDate), categoryId: 'fixed_auto',
            fixedCostId: fc.id, name: fc.name, amount: fc.amount, type: 'fixed',
            memo: `${realCurrentCycle.month}月度 ${fc.withdrawalDay === 99 ? '月末' : fc.withdrawalDay + '日'}引き落とし`,
            isAutoAdded: true, cycleKey: cycleKey
          });
        }
      });

      if (newExpenses.length > 0) {
        appData.expenses = [...appData.expenses, ...newExpenses];
        saveData();
      }
    };

    const renderHeaderHTML = (viewCycle) => {
      const realCurrentCycle = getCycle(new Date());
      const cycles = new Map();
      for(let i = -24; i <= 1; i++) {
        let y = realCurrentCycle.year, m = realCurrentCycle.month + i;
        while(m < 1) { m += 12; y -= 1; } while(m > 12) { m -= 12; y += 1; }
        cycles.set(`${y}-${m}`, { year: y, month: m });
      }
      appData.expenses.forEach(e => { const c = getCycle(new Date(e.date)); cycles.set(`${c.year}-${c.month}`, { year: c.year, month: c.month }); });
      const cycleList = Array.from(cycles.values()).sort((a, b) => b.year - a.year || b.month - a.month);
      let optionsHTML = cycleList.map(c => `<option value="${c.year}-${c.month}" ${(c.year === viewCycle.year && c.month === viewCycle.month) ? 'selected' : ''}>${c.year}年${c.month}月度</option>`).join('');

      return `
        <div><h1 class="font-bold text-lg text-emerald-600 flex items-center"><i data-lucide="wallet" class="w-5 h-5 mr-2"></i>家計簿</h1></div>
        <div class="flex items-center space-x-3">
          <div id="header-sync-status" class="flex items-center justify-center"></div>
          <div class="relative">
            <select id="cycle-select" class="text-xs font-bold bg-gray-100 pl-3 pr-7 py-1.5 rounded-full text-gray-700 appearance-none outline-none cursor-pointer focus:ring-2 focus:ring-emerald-500 shadow-sm">${optionsHTML}</select>
            <i data-lucide="chevron-down" class="w-3 h-3 text-gray-500 absolute right-2.5 top-1/2 transform -translate-y-1/2 pointer-events-none"></i>
          </div>
        </div>`;
    };

    const renderNavHTML = () => {
      const items = [
        { id: 'home', label: 'ホーム', icon: 'home' }, { id: 'history', label: '履歴', icon: 'list' },
        { id: 'todo', label: 'リスト', icon: 'check-square' }, { id: 'yearly', label: '年次', icon: 'trending-up' },
        { id: 'settings', label: '設定', icon: 'settings' }
      ];
      return items.map(item => `
        <button class="nav-btn flex flex-col items-center justify-center w-1/5 py-2 transition-colors ${activeTab === item.id ? 'text-emerald-500' : 'text-gray-400 hover:text-gray-600'}" data-tab="${item.id}">
          <div class="mb-1 transition-transform ${activeTab === item.id ? 'transform scale-110' : ''}"><i data-lucide="${item.icon}" class="w-6 h-6"></i></div>
          <span class="text-[10px] font-bold">${item.label}</span>
        </button>
      `).join('');
    };

    const renderHomeHTML = (currentCycle) => {
      const displayCategories = appData.categories.filter(c => c.type === (currentTransactionType === 'expense' ? 'variable' : 'income'));
      const cycleExpenses = appData.expenses.filter(e => {
        const d = new Date(e.date); d.setHours(0,0,0,0);
        const start = new Date(currentCycle.startDate); start.setHours(0,0,0,0);
        const end = new Date(currentCycle.endDate); end.setHours(0,0,0,0);
        return d >= start && d <= end;
      });

      const variableExpense = cycleExpenses.filter(e => e.type === 'expense' || e.type === 'variable').reduce((sum, e) => sum + e.amount, 0);
      const fixedExpense = cycleExpenses.filter(e => e.type === 'fixed').reduce((sum, e) => sum + e.amount, 0);
      const totalIncome = cycleExpenses.filter(e => e.type === 'income').reduce((sum, e) => sum + e.amount, 0);
      
      const currentSpecialIncome = appData.specialTransactions.filter(t => t.month === currentCycle.month && (t.year === currentCycle.year || !t.year) && t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
      const currentSpecialExpense = appData.specialTransactions.filter(t => t.month === currentCycle.month && (t.year === currentCycle.year || !t.year) && t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

      const baseBudget = appData.budget.monthly + totalIncome;
      const remaining = baseBudget - variableExpense;
      const ratio = baseBudget > 0 ? remaining / baseBudget : 0;
      let statusColor = 'bg-emerald-500', textColor = 'text-emerald-600', bgColor = 'bg-emerald-50', message = '順調です！このペースを維持しましょう。';
      if (remaining < 0) { statusColor = 'bg-red-600'; textColor = 'text-red-600'; bgColor = 'bg-red-50'; message = '予算を超過しています！'; } 
      else if (ratio < 0.2) { statusColor = 'bg-red-500'; textColor = 'text-red-500'; bgColor = 'bg-red-50'; message = '危険！予算が残りわずかです。'; } 
      else if (ratio < 0.5) { statusColor = 'bg-yellow-400'; textColor = 'text-yellow-600'; bgColor = 'bg-yellow-50'; message = '注意！予算の半分を切りました。'; }
      const percentage = Math.max(0, Math.min(100, ratio * 100));

      let chipsHTML = displayCategories.map(c => {
        const isSelected = String(selectedVariableCategoryId) === String(c.id);
        const classes = isSelected ? (currentTransactionType === 'expense' ? 'bg-gray-800 text-white shadow-md' : 'bg-blue-600 text-white shadow-md') : 'bg-gray-100 text-gray-600 hover:bg-gray-200';
        return `<button type="button" class="chip-btn px-4 py-2 rounded-full text-sm font-medium transition-colors ${classes}" data-id="${c.id}">${escapeHTML(c.name)}</button>`;
      }).join('');

      return `
        <div class="rounded-2xl p-6 shadow-sm border border-gray-100 ${bgColor} transition-colors duration-500">
          <div class="flex items-center justify-between mb-1">
            <span class="text-sm font-semibold text-gray-600">今月の残り予算</span>
            <span class="text-xs font-bold px-2 py-1 rounded-full ${statusColor} text-white shadow-sm">残り ${percentage.toFixed(0)}%</span>
          </div>
          <div class="mt-4 bg-gray-200/60 rounded-full h-10 overflow-hidden relative shadow-inner">
            <div class="h-full ${statusColor} transition-all duration-1000 ease-out" style="width: ${percentage}%;"></div>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none px-4">
              <span class="text-white font-extrabold text-lg whitespace-nowrap tracking-wide" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.8), -1px -1px 2px rgba(0,0,0,0.8), 1px -1px 2px rgba(0,0,0,0.8), -1px 1px 2px rgba(0,0,0,0.8);">${formatCurrency(remaining)}</span>
            </div>
          </div>
          <div class="flex items-center text-xs text-gray-500 mt-3 font-medium"><i data-lucide="alert-circle" class="w-4 h-4 mr-1"></i>${message}</div>
          <div class="mt-4 pt-3 border-t border-white/60 flex justify-between text-xs text-gray-600 font-medium gap-2">
            <div class="flex-1">
              <div class="text-gray-500 mb-1">【変動費・予算】</div>
              <div>設定予算: ${formatCurrency(appData.budget.monthly)}</div>
              <div class="text-gray-800">支出合計: -${formatCurrency(variableExpense)}</div>
              ${totalIncome > 0 ? `<div class="text-blue-600">収入合計: +${formatCurrency(totalIncome)}</div>` : ''}
            </div>
            <div class="flex-1 text-right border-l border-white/60 pl-2">
              <div class="text-gray-500 mb-1">【固定費・特別収支】</div>
              <div>固定費: -${formatCurrency(fixedExpense)}</div>
              ${currentSpecialExpense > 0 ? `<div class="text-red-600">特別支出: -${formatCurrency(currentSpecialExpense)}</div>` : ''}
              ${currentSpecialIncome > 0 ? `<div class="text-blue-600">特別収入: +${formatCurrency(currentSpecialIncome)}</div>` : ''}
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 shrink-0">
          <form id="home-expense-form" class="space-y-3">
            <div class="flex bg-gray-100 rounded-lg p-1 mb-1">
              <button type="button" class="flex-1 py-1.5 text-sm font-bold rounded-md transition-colors transaction-type-btn ${currentTransactionType === 'expense' ? 'bg-white shadow-sm text-gray-800' : 'text-gray-500'}" data-type="expense">支出</button>
              <button type="button" class="flex-1 py-1.5 text-sm font-bold rounded-md transition-colors transaction-type-btn ${currentTransactionType === 'income' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500'}" data-type="income">収入</button>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><span class="text-gray-500 font-bold">¥</span></div>
              <input type="number" id="home-amount" placeholder="金額を入力" class="w-full pl-8 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-${currentTransactionType === 'expense' ? 'emerald' : 'blue'}-500 font-bold text-lg" required />
            </div>
            <div class="relative">
              <input type="text" id="home-memo" placeholder="メモを入力 (任意)" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-${currentTransactionType === 'expense' ? 'emerald' : 'blue'}-500 text-sm" />
            </div>
            <input type="hidden" id="home-selected-category" value="${selectedVariableCategoryId}">
            <div class="flex flex-wrap gap-1.5" id="category-chips">${chipsHTML}</div>
            <button type="submit" class="w-full h-12 ${currentTransactionType === 'expense' ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-blue-500 hover:bg-blue-600'} text-white font-bold rounded-xl shadow-sm transition-colors flex items-center justify-center mt-2">
              <i data-lucide="${currentTransactionType === 'expense' ? 'check-circle' : 'plus-circle'}" class="w-5 h-5 mr-2"></i>${currentTransactionType === 'expense' ? '支出を記録する' : '収入を記録する'}
            </button>
          </form>
        </div>`;
    };

    const renderHistoryHTML = (currentCycle) => {
      const cycleExpenses = appData.expenses.filter(e => {
        const d = new Date(e.date); d.setHours(0,0,0,0);
        const start = new Date(currentCycle.startDate); start.setHours(0,0,0,0);
        const end = new Date(currentCycle.endDate); end.setHours(0,0,0,0);
        return d >= start && d <= end;
      }).sort((a, b) => new Date(b.date) - new Date(a.date));

      const totalExpense = cycleExpenses.filter(e => e.type !== 'income').reduce((sum, exp) => sum + exp.amount, 0);
      const totalIncome = cycleExpenses.filter(e => e.type === 'income').reduce((sum, exp) => sum + exp.amount, 0);

      const categoryTotals = cycleExpenses.reduce((acc, exp) => {
        const keyId = String(exp.categoryId) === 'fixed_auto' ? exp.fixedCostId : exp.categoryId;
        if(!acc[keyId]) acc[keyId] = { amount: 0, type: exp.type };
        acc[keyId].amount += exp.amount;
        return acc;
      }, {});

      const sortedVariable = []; const sortedFixed = []; const sortedIncome = [];
      let totalVariable = 0; let totalFixed = 0; let totalIncomeCat = 0;

      Object.entries(categoryTotals).forEach(([id, data]) => {
         if (data.type === 'fixed') { sortedFixed.push({ id, ...data }); totalFixed += data.amount; } 
         else if (data.type === 'expense' || data.type === 'variable') { sortedVariable.push({ id, ...data }); totalVariable += data.amount; } 
         else if (data.type === 'income') { sortedIncome.push({ id, ...data }); totalIncomeCat += data.amount; }
      });
      sortedVariable.sort((a, b) => b.amount - a.amount);
      sortedFixed.sort((a, b) => b.amount - a.amount);
      sortedIncome.sort((a, b) => b.amount - a.amount);

                </div>
                <div class="space-y-1.5 pl-1">

                <div class="space-y-1.5 pl-1">

            </div>
          </div>`;

      let listHTML = cycleExpenses.length === 0 ? `<div class="text-center text-gray-400 mt-10">まだ記録がありません</div>` : 
        `<div class="space-y-3">` + cycleExpenses.map(exp => {

          const name = exp.type === 'fixed' ? (exp.name || getCategoryName(exp.categoryId)) : getCategoryName(exp.categoryId);

        if (!monthlyTotals[key]) monthlyTotals[key] = { year: c.year, month: c.month, amount: 0, items: {} };
        monthlyTotals[key].amount += e.amount;

           uniqueCycleMonths.add(c.month);
           if (!monthlyCategoryTotals[e.categoryId]) monthlyCategoryTotals[e.categoryId] = 0;
           monthlyCategoryTotals[e.categoryId] += e.amount;
        }
      });
      const divBy = Math.max(1, uniqueCycleMonths.size);
      const categoryAverages = appData.categories.filter(c => c.type === 'variable')
         .map(cat => ({ id: cat.id, name: cat.name, avg: Math.round((monthlyCategoryTotals[cat.id] || 0) / divBy) }))
         .sort((a,b) => b.avg - a.avg);

      let specialHTML = specialInThisYear.sort((a, b) => a.month - b.month).map(st => `

            <div class="min-w-0"><div class="font-medium text-gray-800 truncate text-sm">${escapeHTML(st.name)}</div>${st.memo ? `<div class="text-[10px] text-gray-500 truncate">${escapeHTML(st.memo)}</div>` : ''}</div>

    const renderSettingsHTML = () => {

        fixed: { title: '固定費設定', html: `<div class="space-y-3">${fixedHTML}</div>${fixedFormHTML}` },

    };

    const renderModals = () => {
      const container = document.getElementById('modals');
      let modalHTML = '';

      if (deleteCatModalState.isOpen) {
        const targetCat = appData.categories.find(c => String(c.id) === String(deleteCatModalState.catId));
        const transferCategories = appData.categories.filter(c => c.type === targetCat?.type && String(c.id) !== String(deleteCatModalState.catId));
        let optionsHTML = `<option value="">未選択にする</option>` + transferCategories.map(c => `<option value="${c.id}">${escapeHTML(c.name)} に変更</option>`).join('');
        modalHTML += `<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm"><h3 class="font-bold mb-3">ラベル削除</h3><div class="mb-6"><select id="transfer-cat-select" class="w-full p-3 border rounded-xl text-sm">${optionsHTML}</select></div><div class="flex space-x-3"><button id="close-cat-modal-btn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold text-sm">キャンセル</button><button id="exec-del-cat-btn" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold text-sm">削除</button></div></div></div>`;
      }

      if (editExpenseModalState.isOpen) {
        const exp = appData.expenses.find(e => String(e.id) === String(editExpenseModalState.expId));
        if (exp) {
          const isFixed = exp.type === 'fixed';
          let catOptions = isFixed ? '' : appData.categories.filter(c => c.type === exp.type).map(c => `<option value="${c.id}" ${String(c.id) === String(exp.categoryId) ? 'selected' : ''}>${escapeHTML(c.name)}</option>`).join('');
          modalHTML += `
            <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
              <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                <h3 class="font-bold mb-4">記録の編集</h3>
                <form id="edit-expense-form" class="space-y-4">
                  <input type="hidden" id="edit-exp-id" value="${exp.id}">
                  ${isFixed ? `<div class="text-sm font-bold bg-blue-50 p-3 rounded-lg">${escapeHTML(exp.name || '固定費')}</div>` : `<div><label class="block text-xs mb-1">カテゴリ</label><select id="edit-exp-cat" class="w-full p-2 border rounded-xl">${catOptions}</select></div>`}
                  <div><label class="block text-xs mb-1">金額</label><input type="number" id="edit-exp-amount" value="${escapeHTML(exp.amount)}" class="w-full p-2 border rounded-xl" required></div>
                  <div><label class="block text-xs mb-1">日付</label><input type="date" id="edit-exp-date" value="${escapeHTML(exp.date)}" class="w-full p-2 border rounded-xl" required></div>
                  <div><label class="block text-xs mb-1">メモ</label><input type="text" id="edit-exp-memo" value="${escapeHTML(exp.memo || '')}" class="w-full p-2 border rounded-xl"></div>
                  <div class="flex space-x-3"><button type="button" id="close-edit-exp-btn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold text-sm">キャンセル</button><button type="submit" class="flex-1 bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm">保存</button></div>
                </form>
              </div>
            </div>`;
        }
      }

      if (editSpecialModalState.isOpen) {
        const st = appData.specialTransactions.find(s => String(s.id) === String(editSpecialModalState.stId));
        if (st) {
          const currY = new Date().getFullYear();
          modalHTML += `
            <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl"><h3 class="font-bold mb-4">特別収支の編集</h3><form id="edit-special-form" class="space-y-4">
              <input type="hidden" id="edit-st-id" value="${st.id}">
              <div class="grid grid-cols-2 gap-2"><div><label class="block text-xs mb-1">年</label><select id="edit-st-year" class="w-full p-2 border rounded-xl"><option value="${currY}" ${st.year === currY ? 'selected' : ''}>${currY}年</option><option value="${currY + 1}" ${st.year === currY + 1 ? 'selected' : ''}>${currY + 1}年</option></select></div><div><label class="block text-xs mb-1">月</label><select id="edit-st-month" class="w-full p-2 border rounded-xl">${Array.from({length: 12}, (_, i) => `<option value="${i+1}" ${st.month === i+1 ? 'selected' : ''}>${i+1}月</option>`).join('')}</select></div></div>
              <div class="grid grid-cols-2 gap-2"><div><label class="block text-xs mb-1">種類</label><select id="edit-st-type" class="w-full p-2 border rounded-xl"><option value="expense" ${st.type === 'expense' ? 'selected' : ''}>支出</option><option value="income" ${st.type === 'income' ? 'selected' : ''}>収入</option></select></div><div><label class="block text-xs mb-1">項目名</label><input type="text" id="edit-st-name" value="${escapeHTML(st.name)}" class="w-full p-2 border rounded-xl" required></div></div>
              <div><label class="block text-xs mb-1">金額</label><input type="number" id="edit-st-amount" value="${escapeHTML(st.amount)}" class="w-full p-2 border rounded-xl" required></div>
              <div><label class="block text-xs mb-1">メモ</label><input type="text" id="edit-st-memo" value="${escapeHTML(st.memo || '')}" class="w-full p-2 border rounded-xl"></div>
              <div class="flex space-x-3"><button type="button" id="close-edit-st-btn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold text-sm">キャンセル</button><button type="submit" class="flex-1 bg-blue-500 text-white py-3 rounded-xl font-bold text-sm">保存</button></div>
            </form></div></div>`;
        }
      }

      if (confirmModalState.isOpen) modalHTML += `<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm"><h3 class="font-bold mb-3">確認</h3><p class="text-sm mb-6">${confirmModalState.message}</p><div class="flex space-x-3"><button id="confirm-cancel-btn" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold text-sm">キャンセル</button><button id="confirm-ok-btn" class="flex-1 bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm">OK</button></div></div></div>`;
      if (alertModalState.isOpen) modalHTML += `<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm"><h3 class="font-bold mb-3">お知らせ</h3><p class="text-sm mb-6">${alertModalState.message}</p><button id="alert-ok-btn" class="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm">OK</button></div></div>`;

      container.innerHTML = modalHTML;
    };

    const updateView = () => {
      if (!appData) return;
      const currentCycle = getCycle(viewCycleDate);
      document.getElementById('header').innerHTML = renderHeaderHTML(currentCycle);
      
      ['home', 'history', 'todo', 'yearly', 'settings'].forEach(tab => document.getElementById(`tab-${tab}`).classList.add('hidden'));
      const activeContainer = document.getElementById(`tab-${activeTab}`);
      activeContainer.classList.remove('hidden');
      
      if (activeTab === 'home') activeContainer.innerHTML = renderHomeHTML(currentCycle);
      if (activeTab === 'history') activeContainer.innerHTML = renderHistoryHTML(currentCycle);
      if (activeTab === 'todo') activeContainer.innerHTML = renderTodoHTML();
      if (activeTab === 'yearly') activeContainer.innerHTML = renderYearlyHTML(currentCycle);
      if (activeTab === 'settings') activeContainer.innerHTML = renderSettingsHTML();
      
      document.getElementById('nav').innerHTML = renderNavHTML();
      renderModals();
      updateSyncStatusUI();
    };

    const handleExportCSV = () => {
      const currentCycle = getCycle(viewCycleDate);
      const cycleExpenses = appData.expenses.filter(e => {
        const d = new Date(e.date); d.setHours(0,0,0,0);
        const start = new Date(currentCycle.startDate); start.setHours(0,0,0,0);
        const end = new Date(currentCycle.endDate); end.setHours(0,0,0,0);
        return d >= start && d <= end;
      }).sort((a, b) => new Date(b.date) - new Date(a.date));

      const header = "日付,項目,金額,メモ\n";
      const rows = cycleExpenses.map(e => {
        const d = new Date(e.date);
        const yyyymmdd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        const itemName = e.type === 'fixed' ? (e.name || getCategoryName(e.categoryId)) : getCategoryName(e.categoryId);
        const memo = e.memo ? `"${e.memo.replace(/"/g, '""')}"` : "";
        const amt = e.type === 'income' ? e.amount : -e.amount;
        return `${yyyymmdd},${itemName},${amt},${memo}`;
      }).join("\n");

      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      const blob = new Blob([bom, header + rows], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `家計簿履歴_${currentCycle.year}${String(currentCycle.month).padStart(2, '0')}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    };

    document.body.addEventListener('click', async (e) => {
      
      const loginBtn = e.target.closest('#login-btn');
      if (loginBtn) {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(error => alert('ログインに失敗しました: ' + error.message));
        return;
      }
      const logoutBtn = e.target.closest('#logout-btn');
      if (logoutBtn) { if(confirm('ログアウトしますか？')) signOut(auth); return; }

      const migrateBtn = e.target.closest('#migrate-gas-btn');
      if (migrateBtn) {
        if(!confirm("旧システム(GAS)からデータを読み込み、Firebaseに保存しますか？\n※現在のFirebaseのデータは上書きされます")) return;
        migrateBtn.innerHTML = '<i data-lucide="refresh-cw" class="w-4 h-4 mr-2 animate-spin"></i>移行中...';
        try {
          const response = await fetch(GAS_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'load' }) });
          const result = await response.json();
          if (result.status === 'success' && result.data) {
            appData = result.data; sanitizeAppData(); await saveData(); alert('引き継ぎが完了しました！'); updateView();
          } else alert('GAS側にデータが見つかりませんでした。');
        } catch (err) { alert('移行に失敗しました。'); }
        migrateBtn.innerHTML = '<i data-lucide="download-cloud" class="w-4 h-4 mr-2"></i>過去のデータをGASから引き継ぐ';
        lucide.createIcons(); return;
      }

      const blockBtn = e.target.closest('.chart-block-btn');
      if (blockBtn) {
          const year = parseInt(blockBtn.dataset.year, 10); const month = parseInt(blockBtn.dataset.month, 10); const grpId = blockBtn.dataset.group;
          const container = document.getElementById('chart-breakdown-container');
          if (!container) return;
          
          const info = grpId === 'fixed' ? {name: '固定費', color: 'bg-rose-500'} : (appData.chartGroups[grpId] || {name: 'その他', color: 'bg-gray-400'});
          let groupCats = [];
          if (grpId === 'fixed') { groupCats = appData.fixedCosts.map(fc => ({ id: fc.id, name: fc.name })); } 
          else { groupCats = appData.categories.filter(c => c.type === 'variable' && (c.groupId === grpId || (!c.groupId && grpId === 'g3'))); }
          
          const targetExpenses = appData.expenses.filter(e => { const c = getCycle(new Date(e.date)); return c.year === year && c.month === month && e.type !== 'income'; });
          const catTotals = {}; let totalGrpAmt = 0;
          
          targetExpenses.forEach(e => {
              let eGrp = 'g3';
              if (e.type === 'fixed') eGrp = 'fixed';
              else { const cat = appData.categories.find(c => String(c.id) === String(e.categoryId)); eGrp = cat ? (cat.groupId || 'g3') : 'g3'; }
              if (eGrp === grpId) {
                  const id = e.type === 'fixed' ? (e.fixedCostId || e.categoryId) : e.categoryId;
                  catTotals[id] = (catTotals[id] || 0) + e.amount;
                  totalGrpAmt += e.amount;
              }
          });
          
          const listHTML = groupCats.map(cat => `
              <div class="flex justify-between items-center py-1.5 border-b border-gray-100 last:border-0">
                  <span class="text-xs text-gray-600">${escapeHTML(cat.name)}</span>
                  <span class="text-sm font-bold text-gray-800">${formatCurrency(catTotals[cat.id] || 0)}</span>
              </div>
          `).join('');
          
          container.innerHTML = `
              <div class="flex items-center justify-between mb-2">
                  <div class="flex items-center"><span class="w-3 h-3 rounded-full ${info.color} mr-2 shadow-inner"></span><span class="text-sm font-bold text-gray-800">${year}年${month}月 - ${escapeHTML(info.name)}</span></div>
                  <button type="button" id="close-chart-breakdown" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-4 h-4"></i></button>
              </div>
              <div class="text-[10px] text-gray-500 mb-2 leading-relaxed border-b border-dashed border-gray-200 pb-2">構成カテゴリ：${groupCats.length > 0 ? groupCats.map(c=>escapeHTML(c.name)).join('、') : 'なし'}</div>
              <div class="bg-white rounded-lg p-2 shadow-sm border border-gray-100">
                  ${listHTML || '<div class="text-xs text-gray-400 py-2 text-center">データがありません</div>'}
                  <div class="flex justify-between items-center pt-2 mt-1 border-t border-gray-200 font-bold text-sm"><span>合計</span><span>${formatCurrency(totalGrpAmt)}</span></div>
              </div>
          `;
          container.classList.remove('hidden'); lucide.createIcons();
          setTimeout(() => container.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
          return;
      }

      if (e.target.closest('#close-chart-breakdown')) {
          const container = document.getElementById('chart-breakdown-container');
          if (container) container.classList.add('hidden');
          return;
      }

      if (e.target.closest('.move-sec-up')) {
        const btn = e.target.closest('.move-sec-up'); if (btn.disabled) return;
        const id = btn.dataset.id; const idx = appData.settingsOrder.indexOf(id);
        if (idx > 0) { [appData.settingsOrder[idx - 1], appData.settingsOrder[idx]] = [appData.settingsOrder[idx], appData.settingsOrder[idx - 1]]; saveData(); updateView(); }
        return;
      }
      if (e.target.closest('.move-sec-down')) {
        const btn = e.target.closest('.move-sec-down'); if (btn.disabled) return;
        const id = btn.dataset.id; const idx = appData.settingsOrder.indexOf(id);
        if (idx < appData.settingsOrder.length - 1) { [appData.settingsOrder[idx + 1], appData.settingsOrder[idx]] = [appData.settingsOrder[idx], appData.settingsOrder[idx + 1]]; saveData(); updateView(); }
        return;
      }

      if (e.target.closest('.move-cg-up-btn')) {
        const btn = e.target.closest('.move-cg-up-btn'); if (btn.disabled) return;
        const id = btn.dataset.id; const idx = appData.chartGroupOrder.indexOf(id);
        if (idx > 0) { [appData.chartGroupOrder[idx - 1], appData.chartGroupOrder[idx]] = [appData.chartGroupOrder[idx], appData.chartGroupOrder[idx - 1]]; saveData(); updateView(); }
        return;
      }
      if (e.target.closest('.move-cg-down-btn')) {
        const btn = e.target.closest('.move-cg-down-btn'); if (btn.disabled) return;
        const id = btn.dataset.id; const idx = appData.chartGroupOrder.indexOf(id);
        if (idx < appData.chartGroupOrder.length - 1) { [appData.chartGroupOrder[idx + 1], appData.chartGroupOrder[idx]] = [appData.chartGroupOrder[idx], appData.chartGroupOrder[idx + 1]]; saveData(); updateView(); }
        return;
      }

      if (e.target.closest('#confirm-cancel-btn')) { confirmModalState.isOpen = false; confirmModalState.onConfirm = null; updateView(); return; }
      if (e.target.closest('#confirm-ok-btn')) { if (confirmModalState.onConfirm) confirmModalState.onConfirm(); confirmModalState.isOpen = false; confirmModalState.onConfirm = null; updateView(); return; }
      if (e.target.closest('#alert-ok-btn')) { alertModalState.isOpen = false; updateView(); return; }

      const editExpBtn = e.target.closest('.edit-exp-btn');
      if (editExpBtn) { editExpenseModalState.isOpen = true; editExpenseModalState.expId = editExpBtn.dataset.id; renderModals(); lucide.createIcons(); return; }
      if (e.target.closest('#close-edit-exp-btn')) { editExpenseModalState.isOpen = false; editExpenseModalState.expId = null; renderModals(); return; }

      const editSpecialBtn = e.target.closest('.edit-special-btn');
      if (editSpecialBtn) { editSpecialModalState.isOpen = true; editSpecialModalState.stId = editSpecialBtn.dataset.id; renderModals(); return; }
      if (e.target.closest('#close-edit-st-btn')) { editSpecialModalState.isOpen = false; editSpecialModalState.stId = null; renderModals(); return; }

      const navBtn = e.target.closest('.nav-btn');
      if (navBtn) { activeTab = navBtn.dataset.tab; updateView(); return; }

      const typeBtn = e.target.closest('.transaction-type-btn');
      if (typeBtn) {
        currentTransactionType = typeBtn.dataset.type;
        const displayCategories = appData.categories.filter(c => c.type === (currentTransactionType === 'expense' ? 'variable' : 'income'));
        if (displayCategories.length > 0) selectedVariableCategoryId = displayCategories[0].id;
        updateView(); return;
      }
      const chipBtn = e.target.closest('.chip-btn');
      if (chipBtn) { selectedVariableCategoryId = chipBtn.dataset.id; updateView(); return; }
      const delExpBtn = e.target.closest('.del-exp-btn');
      if (delExpBtn) {
        confirmAction('この記録を削除しますか？', () => { appData.expenses = appData.expenses.filter(exp => String(exp.id) !== String(delExpBtn.dataset.id)); saveData(); updateView(); }); return;
      }
      if (e.target.closest('#export-csv-btn')) { handleExportCSV(); return; }
      if (e.target.closest('#save-budget-btn')) { appData.budget.monthly = Number(document.getElementById('budget-month-input').value); saveData(); alertAction('予算を保存しました'); return; }
      
      const openDelCatBtn = e.target.closest('.open-del-cat-btn');
      if (openDelCatBtn) { deleteCatModalState.isOpen = true; deleteCatModalState.catId = openDelCatBtn.dataset.id; renderModals(); return; }
      if (e.target.closest('#close-cat-modal-btn')) { deleteCatModalState.isOpen = false; deleteCatModalState.catId = null; renderModals(); return; }
      if (e.target.closest('#exec-del-cat-btn')) {
        const targetCatId = String(deleteCatModalState.catId);
        const transferId = document.getElementById('transfer-cat-select')?.value || '';
        appData.expenses = appData.expenses.map(exp => String(exp.categoryId) === targetCatId ? { ...exp, categoryId: transferId ? Number(transferId) : 'unassigned' } : exp);
        appData.categories = appData.categories.filter(c => String(c.id) !== targetCatId);
        saveData(); deleteCatModalState.isOpen = false; deleteCatModalState.catId = null;
        const displayCategories = appData.categories.filter(c => c.type === (currentTransactionType === 'expense' ? 'variable' : 'income'));
        if (String(selectedVariableCategoryId) === targetCatId) selectedVariableCategoryId = displayCategories.length > 0 ? displayCategories[0].id : null;
        updateView(); return;
      }

      const moveCatUpBtn = e.target.closest('.move-cat-up-btn');
      if (moveCatUpBtn && !moveCatUpBtn.disabled) {
        const catIndex = appData.categories.findIndex(c => String(c.id) === String(moveCatUpBtn.dataset.id));
        if (catIndex > 0) {
          const currentCat = appData.categories[catIndex]; let prevIndex = -1;
          for(let i = catIndex - 1; i >= 0; i--) { if(appData.categories[i].type === currentCat.type) { prevIndex = i; break; } }
          if (prevIndex !== -1) {
            const temp = appData.categories[prevIndex]; appData.categories[prevIndex] = appData.categories[catIndex]; appData.categories[catIndex] = temp;
            saveData(); updateView();
          }
        } return;
      }
      const moveCatDownBtn = e.target.closest('.move-cat-down-btn');
      if (moveCatDownBtn && !moveCatDownBtn.disabled) {
        const catIndex = appData.categories.findIndex(c => String(c.id) === String(moveCatDownBtn.dataset.id));
        if (catIndex > -1 && catIndex < appData.categories.length - 1) {
          const currentCat = appData.categories[catIndex]; let nextIndex = -1;
          for(let i = catIndex + 1; i < appData.categories.length; i++) { if(appData.categories[i].type === currentCat.type) { nextIndex = i; break; } }
          if (nextIndex !== -1) {
            const temp = appData.categories[nextIndex]; appData.categories[nextIndex] = appData.categories[catIndex]; appData.categories[catIndex] = temp;
            saveData(); updateView();
          }
        } return;
      }
      if (e.target.closest('#toggle-fixed-form-btn')) { showFixedForm = true; updateView(); return; }
      if (e.target.closest('#cancel-fixed-form-btn')) { showFixedForm = false; updateView(); return; }
      const delFixedBtn = e.target.closest('.del-fixed-btn');
      if (delFixedBtn) { confirmAction('この固定費を削除しますか？', () => { appData.fixedCosts = appData.fixedCosts.filter(fc => String(fc.id) !== String(delFixedBtn.dataset.id)); saveData(); updateView(); }); return; }
      const delSpecialBtn = e.target.closest('.del-special-btn');
      if (delSpecialBtn) { confirmAction('この特別収支を削除しますか？', () => { appData.specialTransactions = appData.specialTransactions.filter(st => String(st.id) !== String(delSpecialBtn.dataset.id)); saveData(); updateView(); }); return; }
    });

    document.body.addEventListener('submit', (e) => {
      e.preventDefault();
      if (e.target.id === 'edit-expense-form') {
        const id = document.getElementById('edit-exp-id').value; const amount = parseInt(document.getElementById('edit-exp-amount').value, 10);
        const date = document.getElementById('edit-exp-date').value; const memo = document.getElementById('edit-exp-memo').value;
        if (isNaN(amount) || !date) return;
        const expIndex = appData.expenses.findIndex(exp => String(exp.id) === String(id));
        if (expIndex !== -1) {
          const isFixed = appData.expenses[expIndex].type === 'fixed';
          appData.expenses[expIndex].amount = amount; appData.expenses[expIndex].date = date; appData.expenses[expIndex].memo = memo;
          const c = getCycle(new Date(date)); appData.expenses[expIndex].cycleKey = `${c.year}-${c.month}`;
          if (!isFixed) { const catId = document.getElementById('edit-exp-cat').value; appData.expenses[expIndex].categoryId = Number(catId) || catId; }
          saveData(); editExpenseModalState.isOpen = false; editExpenseModalState.expId = null; updateView();
        } return;
      }
      if (e.target.id === 'edit-special-form') {
        const id = document.getElementById('edit-st-id').value;
        const year = parseInt(document.getElementById('edit-st-year').value, 10); const month = parseInt(document.getElementById('edit-st-month').value, 10);
        const type = document.getElementById('edit-st-type').value; const name = document.getElementById('edit-st-name').value;
        const amount = parseInt(document.getElementById('edit-st-amount').value, 10); const memo = document.getElementById('edit-st-memo').value;
        if (!name || isNaN(amount)) return;
        const stIndex = appData.specialTransactions.findIndex(st => String(st.id) === String(id));
        if (stIndex !== -1) {
          appData.specialTransactions[stIndex] = { ...appData.specialTransactions[stIndex], year, month, type, name, amount, memo };
          saveData(); editSpecialModalState.isOpen = false; editSpecialModalState.stId = null; updateView();
        } return;
      }
      if (e.target.id === 'home-expense-form') {
        const amount = parseInt(document.getElementById('home-amount').value, 10); const memo = document.getElementById('home-memo').value;
        if (isNaN(amount)) return;
        const category = appData.categories.find(c => String(c.id) === String(selectedVariableCategoryId));
        appData.expenses.push({ id: generateUUID(), date: formatDate(new Date()), categoryId: category ? category.id : selectedVariableCategoryId, amount: amount, type: category ? category.type : currentTransactionType, memo: memo });
        saveData(); updateView(); return;
      }
      if (e.target.classList.contains('add-category-form')) {
        const type = e.target.dataset.type; const name = e.target.querySelector('.new-cat-name').value;
        if(!name) return;
        appData.categories.push({ id: Date.now(), name: name, type: type }); saveData(); updateView(); return;
      }
      if (e.target.id === 'add-fixed-form') {
        const name = document.getElementById('new-fixed-name').value; const amount = parseInt(document.getElementById('new-fixed-amount').value, 10); const day = parseInt(document.getElementById('new-fixed-day').value, 10);
        if(!name || isNaN(amount) || isNaN(day)) return;
        appData.fixedCosts.push({ id: generateUUID(), name: name, amount: amount, withdrawalDay: day }); showFixedForm = false; saveData(); updateView(); return;
      }
      if (e.target.id === 'add-special-form') {
        const year = parseInt(document.getElementById('st-year').value, 10); const month = parseInt(document.getElementById('st-month').value, 10);
        const type = document.getElementById('st-type').value; const name = document.getElementById('st-name').value;
        const amount = parseInt(document.getElementById('st-amount').value, 10); const memo = document.getElementById('st-memo').value;
        if(!name || isNaN(amount)) return;
        appData.specialTransactions.push({ id: generateUUID(), name: name, amount: amount, month: month, year: year, type: type, memo: memo }); saveData(); updateView(); return;
      }
      if (e.target.id === 'add-todo-form') {
        const text = document.getElementById('new-todo-text').value;
        if (!text) return; todoList.push({ id: generateUUID(), text }); saveTodo(); updateView(); return;
      }
    });

    document.body.addEventListener('change', (e) => {
      if (e.target.id === 'cycle-select') { const [y, m] = e.target.value.split('-').map(Number); viewCycleDate = getCycleFromYearMonth(y, m); updateView(); }
      if (e.target.id === 'toggle-fixed-chart') { includeFixedCostsInChart = e.target.checked; updateView(); }
      if (e.target.classList.contains('todo-check')) {
        const id = e.target.dataset.id; const itemEl = document.getElementById(`todo-item-${id}`);
        if (itemEl) itemEl.classList.add('opacity-0', 'scale-95');
        setTimeout(() => { todoList = todoList.filter(t => String(t.id) !== String(id)); saveTodo(); updateView(); }, 300);
      }
      
      if (e.target.classList.contains('update-group-name')) {
        const gId = e.target.dataset.gid; appData.chartGroups[gId].name = e.target.value; saveData(); updateView();
      }
      if (e.target.classList.contains('change-cat-group')) {
        const catId = e.target.dataset.catid; const newGroupId = e.target.value;
        const catIndex = appData.categories.findIndex(c => String(c.id) === String(catId));
        if(catIndex !== -1) { appData.categories[catIndex].groupId = newGroupId; saveData(); updateView(); }
      }
    });

    onAuthStateChanged(auth, (user) => {
      const loginScreen = document.getElementById('login-screen'); const appContainer = document.getElementById('app-container');
      if (user) {
        currentUser = user; loginScreen.classList.add('hidden'); appContainer.classList.remove('hidden');
        onSnapshot(doc(db, "users", user.uid), (docSnap) => {
          if (docSnap.exists()) { appData = docSnap.data(); sanitizeAppData(); checkAutoFixedCosts(); updateView(); } 
          else { appData = JSON.parse(JSON.stringify(initialData)); saveData(); updateView(); }
        });
      } else { currentUser = null; appData = null; loginScreen.classList.remove('hidden'); appContainer.classList.add('hidden'); }
    });

  </script>
</body>
</html>
